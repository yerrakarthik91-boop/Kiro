name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Flutter project (creates platform folders)
        run: flutter create . --project-name mms --platforms android,ios,web --org app.mms

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Allow info-level warnings (e.g. deprecated_member_use, prefer_const)
        # to pass; only real errors fail the build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Widget tests
        run: flutter test
